name: Firmware

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade platformio intelhex
      - run: pio test -c platformio-tests.ini -e native

  example-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - d1_mini_lite
          - featheresp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade platformio intelhex
      - run: pio run -j 1 -c platformio-examples.ini -e ${{ matrix.environment }}
