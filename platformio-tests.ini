[platformio]
src_dir = test/host/src
test_dir = test/host

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    ; SunriseLightTime is a double, so the assertions on it need real
    ; double support rather than Unity's float-only default.
    -D UNITY_INCLUDE_DOUBLE
    -Wall
    -Wextra
    -I test/host/stubs
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
